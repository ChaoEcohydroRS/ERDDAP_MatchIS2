# Environment for this repo (steps 01-05 and the figure).
# Step 03d additionally calls the Kd pipeline (RiverMouths_IS2KdMassiveTest),
# which runs in its own environment; see that repository.
name: erddap_is2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas>=2.0
  - scipy
  - matplotlib
  - tqdm
  - h5py
  - sliderule>=5.4
  - pip
  - pip:
      - erddapy>=2.2
      - earthaccess>=0.11
      - icepyx>=2.0
